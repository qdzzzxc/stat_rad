    <g fill="currentColor" stroke="none" font-style="italic" font-size="12">
      <text x="42" y="-72">x<tspan dy="-5" font-size="9">(1)</tspan><tspan dy="5">(t)</tspan></text>
      <text x="14" y="-46">x₁</text><text x="14" y="-28">x₂</text><text x="250" y="-64">x₁ + dx</text><text x="304" y="16">t</text>
    </g>
  </g>

  <!-- реализация 2 -->
  <g transform="translate(0 195)">
