<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 345" font-family="Georgia, serif" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" color="#1f2937">
  <defs><marker id="k1a10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor" stroke="none"/></marker></defs>
  <!-- сечения t1, t2 через все реализации -->
