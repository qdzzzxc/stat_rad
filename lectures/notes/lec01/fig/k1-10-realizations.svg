  </g>
  <g fill="currentColor" stroke="none" font-style="italic" text-anchor="middle">
    <text x="120" y="338">t₁</text><text x="210" y="338">t₂</text>
  </g>

  <!-- реализация 1 -->
  <g transform="translate(0 95)">
