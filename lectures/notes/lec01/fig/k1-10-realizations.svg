    <line x1="34" y1="8" x2="34" y2="-85" marker-end="url(#k1a10)"/>
    <g stroke-width="1" opacity=".55"><line x1="34" y1="-50" x2="296" y2="-50"/><line x1="34" y1="-32" x2="296" y2="-32"/></g>
    <path class="acc" stroke="#2b59c3" stroke-width="2" d="M36 -32C50 -50 60 -44 72 -52S82 -10 90 -8S104 -40 110 -48S118 -56 120 -54S140 -60 150 -52S160 -20 172 -24S196 -18 210 -14S230 -26 246 -30S270 -52 290 -56"/>
    <g fill="currentColor" stroke="none"><circle class="accf" fill="#2b59c3" cx="120" cy="-54" r="3.5"/><circle cx="210" cy="-14" r="3.5"/></g>
    <g fill="currentColor" stroke="none" font-style="italic" font-size="12">
      <text x="42" y="-72">x<tspan dy="-5" font-size="9">(2)</tspan><tspan dy="5">(t)</tspan></text>
      <text x="14" y="-46">x₁</text><text x="14" y="-28">x₂</text><text x="304" y="16">t</text>
    </g>
  </g>

  <text x="60" y="218" fill="currentColor" stroke="none" font-size="16">⋮</text>

  <!-- реализация N -->
