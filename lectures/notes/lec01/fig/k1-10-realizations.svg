    <line x1="34" y1="8" x2="34" y2="-85" marker-end="url(#k1a10)"/>
    <g stroke-width="1" opacity=".55"><line x1="34" y1="-50" x2="296" y2="-50"/><line x1="34" y1="-32" x2="296" y2="-32"/></g>
    <path class="acc" stroke="#2b59c3" stroke-width="2" d="M36 -32C50 -56 70 -50 90 -54S112 -52 120 -50S140 -56 150 -48S156 -8 166 -10S182 -40 196 -46S206 -48 210 -40S214 -8 230 -10S250 -14 262 -12S282 -40 292 -50"/>
    <g fill="currentColor" stroke="none"><circle class="accf" fill="#2b59c3" cx="120" cy="-50" r="3.5"/><circle cx="210" cy="-40" r="3.5"/></g>
    <g fill="currentColor" stroke="none" font-style="italic" font-size="12">
      <text x="42" y="-72">x<tspan dy="-5" font-size="9">(N)</tspan><tspan dy="5">(t)</tspan></text>
      <text x="14" y="-46">x₁</text><text x="14" y="-28">x₂</text><text x="304" y="16">t</text>
