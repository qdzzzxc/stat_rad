    <line x1="34" y1="8" x2="34" y2="-85" marker-end="url(#k1a10)"/>
    <g stroke-width="1" opacity=".55"><line x1="34" y1="-50" x2="296" y2="-50"/><line x1="34" y1="-58" x2="296" y2="-58"/><line x1="34" y1="-32" x2="296" y2="-32"/></g>
    <path class="acc" stroke="#2b59c3" stroke-width="2" d="M36 -40C50 -58 62 -44 74 -52S90 -46 96 -40S108 -12 120 -14S136 -24 150 -12S172 -58 184 -60S202 -62 206 -54S208 -10 210 -12S222 -58 232 -52S244 -20 254 -18S280 -10 296 -12"/>
